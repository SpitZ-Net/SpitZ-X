<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Arcade <span>Hub</span></h1>
        <p>Select a game to play</p>
        
        <div class="game-grid">
            <button class="game-btn" onclick="launchGame('Game 1')">Space Shooter</button>
            <button class="game-btn" onclick="launchGame('Game 2')">Platformer</button>
            <button class="game-btn" onclick="launchGame('Game 3')">Puzzle Quest</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
